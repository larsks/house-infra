[project]
name = "infra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "pyinfra>=3.11.1",
]

# pyinfra adds the `infra` directory to sys.path, so siblings like `roles`
# and `globals` import as top-level modules rather than relative to a
# package. Tell basedpyright about this per-directory search path so it
# doesn't flag these as implicit relative imports.
[tool.basedpyright]
reportUnknownMemberType = false
reportUnusedCallResult = false
reportUnknownArgumentType = false
executionEnvironments = [{ root = "infra", extraPaths = ["infra"] }]
