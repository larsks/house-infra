dns_nameservers:
  - 1.1.1.1
  - 1.0.0.1

dynamic_dns_services:
  - interface: eth0
    services:
      - service: noip
        hostname: oddbit.hopto.org
        login: lars@oddbit.com
        password: "{{ noip_ddns_key }}"
        server: "{{ noip_ddns_server }}"

dns_static_entries:
  - name: .keg.house
    address: 192.168.1.210
  - name: vmetrics.house
    address: 192.168.5.10
