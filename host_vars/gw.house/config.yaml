fw_rules_ipv4:
  - name: LAN_IN
    description: Connections from local network to router
    default_action: accept
    rules:
      - action: accept
        protocol: tcp
        destination:
          address: 192.168.1.1
          port: 22
        log: false
  - name: WAN_IN
    description: Connections from WAN to local network
    default_action: drop
    rules:
      - action: accept
        description: "Allow established/related"
        state:
          - established
          - related
      - action: drop
        description: "Drop invalid state"
        state:
          - invalid
  - name: WAN_LOCAL
    description: Connections from WAN to router
    default_action: drop
    rules:
      - action: accept
        description: "Allow established/related"
        state:
          - established
          - related
      - action: drop
        description: "Drop invalid state"
        state:
          - invalid

fw_rules_ipv6:
  - name: LANv6_IN
    default_action: accept
  - name: WANv6_IN
    description: "WAN inbound traffic forwarded to LAN"
    default_action: drop
    rules:
      - action: accept
        description: "Allow established/related sessions"
        state:
          - established
          - related
      - action: drop
        description: "Drop invalid state"
        state:
          - invalid
      - action: accept
        protocol: icmpv6
      - action: accept
        protocol: tcp
        destination:
          port: 22
  - name: WANv6_LOCAL
    description: "WAN inbound traffic to the router"
    default_action: drop
    rules:
      - action: accept
        description: "Allow established/related sessions"
        state:
          - established
          - related
      - action: drop
        description: "Drop invalid state"
        state:
          - invalid
      - action: accept
        description: "Allow IPv6 icmp"
        protocol: ipv6-icmp
      - action: accept
        description: "allow dhcpv6"
        protocol: udp
        destination:
          port: 546
        source:
          port: 547
