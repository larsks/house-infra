- name: "{{ interface.name }}: Set port mode"
  when: >-
    interface.config.portmode|default("") != ""
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      switchport mode {{ interface.config.portmode }}
  notify: Save configuration

- name: "{{ interface.name }}: Set port description"
  when: >-
    interface.config.description|default("") != ""
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      description "{{ interface.config.description }}"
  notify: Save configuration

- name: "{{ interface.name }}: Set port admin state"
  when: >-
    interface.config.enabled is defined
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      {{ 'no shutdown' if interface.config.enabled else 'shutdown' }}
  notify: Save configuration

- name: "{{ interface.name }}: Set trunk native VLAN"
  when: >-
    interface.config.portmode|default("") == "trunk" and
    interface.config.pvid|default("") != ""
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      switchport trunk native vlan {{ interface.config.pvid }}
  notify: Save configuration

- name: "{{ interface.name }}: Clear trunk native VLAN"
  when: >-
    interface.config.portmode|default("") == "trunk" and
    interface.config.pvid|default("") == ""
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      no switchport trunk native vlan
  notify: Save configuration

- name: "{{ interface.name }}: Set trunk allowed VLANs"
  when: >-
    interface.config.portmode|default("") == "trunk" and
    (interface.config.tagged|default([])|length > 0 or interface.config.pvid|default("") != "")
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      switchport trunk allowed vlan {{ (interface.config.tagged|default([]) + ([interface.config.pvid] if interface.config.pvid|default("") != "" else []))|unique|sort|join(',') }}
  notify: Save configuration

- name: "{{ interface.name }}: Clear trunk allowed VLANs"
  when: >-
    interface.config.portmode|default("") == "trunk" and
    interface.config.tagged|default([])|length == 0 and
    interface.config.pvid|default("") == ""
  ansible.netcommon.cli_config:
    config: |
      interface {{ interface.name }}
      no switchport trunk allowed vlan
  notify: Save configuration

- name: "{{ interface.name }}: Clear general mode VLAN configuration on trunk ports"
  when: >-
    interface.config.portmode|default("") == "trunk"
  block:
    - name: "{{ interface.name }}: Get VLANs defined on the switch"
      ansible.netcommon.cli_command:
        command: show vlan
      register: switch_vlans
      changed_when: false

    - name: "{{ interface.name }}: Determine switch VLAN ids"
      # The default VLAN (type "Default", normally VLAN 1) is handled
      # separately: its unconfigured default participation is "include"
      # (every port is implicitly a member), unlike every other VLAN whose
      # unconfigured default is "auto". Resetting it with "auto" instead of
      # "include" is a deviation from its real default, so the device
      # persists it as an explicit (but functionally inert) running-config
      # line that cannot be removed again afterwards.
      ansible.builtin.set_fact:
        default_vlan_ids: >-
          {{ switch_vlans.stdout_lines
             | select('match', '^\d+\s')
             | select('match', '.*\sDefault$')
             | map('regex_replace', '^(\d+)\s.*$', '\1')
             | list }}
        other_vlan_ids: >-
          {{ switch_vlans.stdout_lines
             | select('match', '^\d+\s')
             | reject('match', '.*\sDefault$')
             | map('regex_replace', '^(\d+)\s.*$', '\1')
             | list }}

    - name: "{{ interface.name }}: Reset default VLAN participation"
      when: default_vlan_ids|length > 0
      ansible.netcommon.cli_config:
        config: |
          interface {{ interface.name }}
          vlan participation include {{ default_vlan_ids|join(',') }}
      notify: Save configuration

    - name: "{{ interface.name }}: Reset other VLANs participation"
      when: other_vlan_ids|length > 0
      ansible.netcommon.cli_config:
        config: |
          interface {{ interface.name }}
          vlan participation auto {{ other_vlan_ids|join(',') }}
      notify: Save configuration

    - name: "{{ interface.name }}: Remove general mode vlan tagging and pvid"
      when: (default_vlan_ids + other_vlan_ids)|length > 0
      ansible.netcommon.cli_config:
        config: |
          interface {{ interface.name }}
          no vlan tagging {{ (default_vlan_ids + other_vlan_ids)|join(',') }}
          no vlan pvid
      notify: Save configuration
