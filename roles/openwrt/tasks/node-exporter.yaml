- name: Install node-exporter packages
  community.openwrt.apk:
    state: present
    name:
      - prometheus-node-exporter-ucode
      - prometheus-node-exporter-ucode-openwrt

- name: Apply patches
  notify: reload-prometheus-node-exporter-ucode
  community.openwrt.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
    - src: thermal.uc
      dest: /usr/share/ucode/node-exporter/lib/thermal.uc
    - src: uname.uc
      dest: /usr/share/ucode/node-exporter/lib/uname.uc

- name: Configure prometheus-node-exporter-ucode
  ansible.builtin.include_tasks:
    file: uci-config.yaml
  vars:
    config_name: prometheus-node-exporter-ucode
