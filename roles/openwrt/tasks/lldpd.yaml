- name: Ensure lldpd is installed
  community.openwrt.apk:
    name:
      - lldpd

- name: Configure lldpd to send on all interfaces
  community.openwrt.uci:
    autocommit: true
    command: delete
    key: lldpd.config.interface
  notify: reload-lldpd

- name: Configure lldpd device location
  community.openwrt.uci:
    autocommit: true
    command: set
    key: lldpd.config.location
    value: 'address country US city "Belmont" street "Livermore Rd" building "64" room "Office"'
  notify: reload-lldpd
