- name: "Ensure wireguard packages are installed"
  ansible.builtin.package:
    name: "{{ wireguard_packages }}"
    state: present

- name: "Ensure {{ wireguard_conf_dir }} exists"
  ansible.builtin.file:
    path: "{{ wireguard_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Generate wireguard interface configurations"
  notify: refresh-wireguard-{{ item.name }}
  ansible.builtin.template:
    src: wg.conf
    dest: "{{ wireguard_conf_dir }}/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wireguard_interfaces }}"
  register: wireguard_status

- name: Enable interfaces at boot
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ item.item.name }}"
    enabled: true
    state: >-
      {{ item.changed | ternary("restarted", "started") }}
  loop: "{{ wireguard_status.results }}"
