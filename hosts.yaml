switches:
  children:
    openwrt_hpe1920:
      vars:
        ansible_ssh_transfer_method: scp
        ansible_scp_extra_args: "-O"
      hosts:
        office-sw-2:
          ansible_user: root
    netgear_m4100:
      vars:
        ansible_user: admin
        ansible_password: "{{ lookup('env', 'ANSIBLE_SSH_PASSWORD') }}"
        ansible_connection: ansible.netcommon.network_cli
        ansible_become: true
        ansible_become_method: enable
        ansible_network_os: community.network.edgeswitch
      hosts:
        office-sw-0:
        office-sw-1:
routers:
  children:
    edgerouter_x:
      hosts:
        gw.house:
          ansible_user: ubnt
external:
  hosts:
    vmetrics.oddbit.com:
      ansible_user: larsks
      ansible_become: true
      ansible_python_interpreter: /usr/bin/python3
