- hosts: openwrt_hpe1920
  tags: switches
  gather_facts: false
  tasks:
    - ansible.builtin.import_role:
        name: openwrt

- hosts: gw.house
  gather_facts: false
  tags: router
  tasks:
    - name: Ensure secrets are available
      delegate_to: localhost
      ansible.builtin.git:
        repo: keybase://private/larsks/secrets
        dest: secrets

    - include_role:
        name: edgerouter
